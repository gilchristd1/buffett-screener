name: Run screen

# Quarterly, a few days after most calendar-year 10-Ks and Q filings have landed,
# plus on demand. The runner has unrestricted internet, which is the whole point:
# it can reach sec.gov, which Claude's sandbox cannot.
on:
  schedule:
    - cron: "0 6 1 3,6,9,12 *"   # 06:00 UTC on the 1st of Mar/Jun/Sep/Dec
  workflow_dispatch:              # manual "Run workflow" button
  push:
    paths:
      - "config.py"               # rerun whenever a threshold changes

permissions:
  contents: write                 # needed to commit results back

env:
  # Set once with: gh secret set SEC_USER_AGENT
  # Kept out of the repo because it contains a contact email and this repo is public.
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check the SEC contact secret is set
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret is not set. Run: gh secret set SEC_USER_AGENT"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify gate logic before trusting any output
        run: |
          python3 tests/test_gates.py
          python3 tests/test_screener_import.py

      - name: Cache the SEC ticker map
        uses: actions/cache@v4
        with:
          path: data/company_tickers.json
          key: sec-tickers-${{ github.run_id }}
          restore-keys: sec-tickers-

      - name: Build universe
        run: python3 run_screen.py --build-universe

      - name: Run gates
        # No bulk download: the universe is already narrowed, so the per-CIK API
        # at 8 req/s finishes in a few minutes and saves a 1.5GB fetch each run.
        run: python3 run_screen.py --screen

      - name: Write run summary
        run: |
          {
            echo "# Screen run — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "- Universe: $(( $(wc -l < out/universe.csv) - 1 )) names"
            echo "- Survivors: $(( $(wc -l < out/survivors.csv 2>/dev/null || echo 1) - 1 ))"
            echo
            echo '## Survivors'
            echo
            cat out/survivors.csv 2>/dev/null || echo "none"
          } > out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "buffett-screener"
          git config user.email "actions@github.com"
          git add -f out/universe.csv out/results.csv out/survivors.csv out/summary.md
          if git diff --cached --quiet; then
            echo "No change in screen output."
          else
            git commit -m "Screen run $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screen-results
          path: out/
          retention-days: 90
