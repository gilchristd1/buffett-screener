name: Run screen

# Quarterly, a few days after most calendar-year 10-Ks and Q filings have landed,
# plus on demand. The runner has unrestricted internet, which is the whole point:
# it can reach sec.gov, which Claude's sandbox cannot.
on:
  schedule:
    - cron: "0 6 1 3,6,9,12 *"   # 06:00 UTC on the 1st of Mar/Jun/Sep/Dec
  workflow_dispatch:              # manual "Run workflow" button
  push:
    paths:
      - "config.py"               # rerun whenever a threshold changes

permissions:
  contents: write                 # needed to commit results back

defaults:
  run:
    # REQUIRED, do not remove. GitHub's implicit shell is `bash -e {0}` with no
    # pipefail, so `python3 ... | tee run.log` would report tee's exit status and
    # every failing step would show green. Naming the shell explicitly gives
    # `bash --noprofile --norc -eo pipefail {0}`.
    shell: bash

env:
  # Set once with: gh secret set SEC_USER_AGENT
  # Kept out of the repo because it contains a contact email and this repo is public.
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check the SEC contact secret is set
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret is not set. Run: gh secret set SEC_USER_AGENT"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify gate logic before trusting any output
        run: |
          python3 tests/test_gates.py
          python3 tests/test_screener_import.py
          python3 tests/test_pipeline.py

      - name: Environment facts
        # Cheap, and it turns "it failed" into "it failed with this much disk,
        # this much memory, reaching SEC or not".
        run: |
          {
            echo "python      $(python3 -V)"
            echo "disk free   $(df -h / | awk 'NR==2{print $4}')"
            echo "memory      $(free -h | awk 'NR==2{print $7" available"}')"
            echo -n "sec.gov     "
            curl -sS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
              -A "$SEC_USER_AGENT" --max-time 30 \
              -r 0-1023 https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip \
              || echo "unreachable"
            echo -n "size hint   "
            curl -sSI -A "$SEC_USER_AGENT" --max-time 30 \
              https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip \
              | grep -i '^content-length' || echo "no content-length"
          } 2>&1 | tee -a run.log

      - name: Download SEC bulk data
        # companyfacts.zip (financials) AND submissions.zip (SIC + exchange).
        # companyfacts carries no sector information whatsoever.
        run: python3 run_screen.py --download 2>&1 | tee -a run.log

      - name: Build universe
        run: python3 run_screen.py --build-universe 2>&1 | tee -a run.log

      - name: Run gates
        run: python3 run_screen.py --screen 2>&1 | tee -a run.log

      - name: Apply size and liquidity filter
        # Non-fatal by design: prices come from a third party and CI runners are
        # often throttled by them. A shortlist that still needs a size check by
        # hand is far more useful than a failed run.
        continue-on-error: true
        run: python3 run_screen.py --size-filter 2>&1 | tee -a run.log

      - name: Score and value the survivors
        # Tiers 4 and 5. Needs the market caps the size filter attaches, so it
        # runs after it. Non-fatal for the same reason: a gated list without a
        # ranking still beats a failed run.
        continue-on-error: true
        run: python3 run_screen.py --rank 2>&1 | tee -a run.log

      - name: Report the error where it is visible
        # The summary page shows only "exit code 1"; the real message sits inside
        # a collapsed step. This puts it in two places that are hard to miss:
        # an annotation (top of the run page) and the step summary (bottom).
        if: failure()
        run: |
          if [ -f run.log ]; then
            # Last line that looks like a cause, surfaced as an annotation.
            CAUSE=$(grep -aE "Error|error|Traceback|HTTP [45][0-9][0-9]|not found|only .* bytes|empty|refused|Max retries" run.log \
                    | tail -3 | tr '\n' ' ' | cut -c1-800)
            [ -z "$CAUSE" ] && CAUSE=$(tail -3 run.log | tr '\n' ' ' | cut -c1-800)
            echo "::error::$CAUSE"
          else
            echo "::error::Failed before any python step ran — no run.log was written."
          fi
          {
            echo "## Run failed"
            echo
            echo '```'
            tail -80 run.log 2>/dev/null || echo "(no run.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write run summary
        run: |
          if [ ! -f out/universe.csv ]; then
            echo "::error::Pipeline produced no output — out/universe.csv is missing."
            exit 1
          fi
          mkdir -p out
          {
            echo "# Screen run — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "- Universe: $(( $(wc -l < out/universe.csv) - 1 )) names"
            echo "- Survivors: $(( $(wc -l < out/survivors.csv 2>/dev/null || echo 1) - 1 ))"
            echo
            if [ -f out/ranked.csv ]; then
              echo "- Ranked: $(( $(wc -l < out/ranked.csv) - 1 )) scored"
              # Read the NAMED column. `grep -c ',yes,'` counted any row with a
              # "yes" anywhere, so when the `priced` column was added run 4's
              # summary reported 37 names clearing the hurdle when 2 did. A
              # summary that is confidently wrong is worse than no summary.
              # NB: a heredoc cannot be used here — inside a YAML block scalar
              # the terminator stays indented and never closes the document.
              python3 -c 'import csv;r=list(csv.DictReader(open("out/ranked.csv")));print("- Clearing the owner-earnings hurdle: %d" % sum(1 for x in r if x.get("clears_hurdle")=="yes"));print("- Price-comparable (score includes the valuation points): %d of %d" % (sum(1 for x in r if x.get("priced")=="yes"), len(r)))'
            fi
            if [ -f out/moat.csv ]; then
              # Named column again, for the same reason as above.
              python3 -c 'import csv;r=list(csv.DictReader(open("out/moat.csv")));from collections import Counter;c=Counter(x["label"] for x in r);print("- Moat durability: %d wide, %d narrow, %d uncertain" % (c["wide"], c["narrow"], c["uncertain"]))'
            fi
            echo
            echo '## Ranked queue'
            echo
            head -15 out/ranked.csv 2>/dev/null || echo "(not ranked)"
            echo
            echo '## Survivors'
            echo
            cat out/survivors.csv 2>/dev/null || echo "none"
          } > out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "buffett-screener"
          git config user.email "actions@github.com"
          # One `git add` per file. A single call listing several paths fails
          # ATOMICALLY when any one is missing — "pathspec did not match" — and
          # then adds none of them. That is why ranked.csv never reached the repo
          # in run 3 even though it was written.
          for f in universe.csv results.csv survivors.csv summary.md ranked.csv \
                   watchlist.csv moat.csv sector_growth.csv; do
            [ -f "out/$f" ] && git add -f "out/$f" || echo "  (no out/$f this run)"
          done
          if git diff --cached --quiet; then
            echo "No change in screen output."
          else
            git commit -m "Screen run $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-results
          path: |
            out/
            run.log
          retention-days: 90
          if-no-files-found: ignore
